mutation RelistListing($input: RelistListingInput!) {
  relistListing(input: $input) {
    __typename
    ... on RelistListingSuccess {
      listing {
        listingId
        sku
        marketplace
        sellerProduct {
          title
          description
          aspects {
            name
            values
          }
          images {
            ebayImageUrl
          }
          categories {
            primaryCategory {
              id
            }
          }
          itemCondition {
            itemConditionId
          }
        }
        items {
          sku
          itemTerms {
            availability {
              quantityAvailable
            }
            pricingTerms {
              fixedPrice {
                original {
                  value
                  currency
                }
              }
            }
          }
        }
        listingTerms {
          fulfillmentTerms {
            __typename
            ... on FulfillmentTerms {
              packageSpecifications {
                packageDimensions {
                  length
                  width
                  height
                }
                packageWeight {
                  majorUnit
                  minorUnit
                }
                listingUnitOfMeasure
              }
              shippingTerms {
                handlingTimeDuration
                shippingServices {
                  rank
                  additionalUnitShippingCostAmount {
                    original {
                      currency
                      value
                    }
                  }
                  includedShipToLocations {
                    continent
                    country
                    sellerShippingRegion
                  }
                  shippingCostAmount {
                    original {
                      currency
                      value
                    }
                  }
                  shippingService {
                    shippingServiceCode
                    displayName
                    expeditedService
                    maxEstimatedDeliveryTimeHours
                    minEstimatedDeliveryTimeHours
                  }
                }
                buyerResponsibleForShipping
              }
              digitalDeliverySupported
              freeShippingAvailable
              globalShippingSupported
              inStorePickupSupported
            }
            ... on BusinessPolicy {
              businessPolicyId
            }
          }
          paymentTerms {
            __typename
            ... on PaymentTerms {
              immediatePay
            }
            ... on BusinessPolicy {
              businessPolicyId
            }
          }
          listingFormat
          lifecycleTerms {
            listingDurationInDays
            startAt
            createdAt
            actualEndAt
            endListingReason
            scheduledEndAt
            listingStatus
          }
          bestOfferTerms {
            acceptBestOffer
            autoAcceptThresholdAmount {
              original {
                value
                currency
              }
            }
            autoDeclineThresholdAmount {
              original {
                value
                currency
              }
            }
          }
          itemLocation {
            country
            postalCode
            location
          }
        }
      }
      listingFees {
        listingFeeType
        feeAmount {
          value
          currency
        }
        promotionalDiscount {
          value
          currency
        }
      }
      warnings {
        warningCode
        warningMessage
        additionalInformation {
          name
          value
        }
      }
    }
    ... on RelistListingValidationError {
      errorCode
      errorMessage
      violations {
        violationCode
        violationDescription
        inputPath
        additionalInformation {
          name
          value
        }
      }
      warnings {
        warningCode
        warningMessage
        additionalInformation {
          name
          value
        }
      }
    }
    ... on RelistListingValidationSuccess {
      listing {
        listingId
        sku
        marketplace
        sellerProduct {
          title
          description
          aspects {
            name
            values
          }
          images {
            ebayImageUrl
          }
          categories {
            primaryCategory {
              id
            }
          }
          itemCondition {
            itemConditionId
          }
        }
        items {
          sku
          itemTerms {
            availability {
              quantityAvailable
            }
            pricingTerms {
              fixedPrice {
                original {
                  value
                  currency
                }
              }
            }
          }
        }
        listingTerms {
          fulfillmentTerms {
            __typename
            ... on FulfillmentTerms {
              packageSpecifications {
                packageDimensions {
                  length
                  width
                  height
                }
                packageWeight {
                  majorUnit
                  minorUnit
                }
                listingUnitOfMeasure
              }
              shippingTerms {
                handlingTimeDuration
                shippingServices {
                  rank
                }
              }
              digitalDeliverySupported
              freeShippingAvailable
              globalShippingSupported
              inStorePickupSupported
            }
            ... on BusinessPolicy {
              businessPolicyId
            }
          }
          paymentTerms {
            __typename
            ... on PaymentTerms {
              immediatePay
            }
            ... on BusinessPolicy {
              businessPolicyId
            }
          }
          listingFormat
          lifecycleTerms {
            listingDurationInDays
            startAt
          }
          bestOfferTerms {
            acceptBestOffer
            autoAcceptThresholdAmount {
              original {
                value
                currency
              }
            }
            autoDeclineThresholdAmount {
              original {
                value
                currency
              }
            }
          }
          itemLocation {
            country
            postalCode
            location
          }
        }
      }
      listingFees {
        listingFeeType
        feeAmount {
          value
          currency
        }
        promotionalDiscount {
          value
          currency
        }
      }
      warnings {
        warningCode
        warningMessage
        additionalInformation {
          name
          value
        }
      }
    }
  }
}
