mutation CreateListing($input: CreateListingInput!) {
  createListing(input: $input) {
    __typename
    ... on CreateListingSuccess {
      listing {
        listingId
        sku
        marketplace
        sellerProduct {
          title
          description
          aspects {
            name
            values
          }
          images {
            ebayImageUrl
          }
          categories {
            primaryCategory {
              id
            }
          }
          itemCondition {
            itemConditionId
          }
        }
        items {
          sku
          itemTerms {
            availability {
              quantityAvailable
            }
            pricingTerms {
              fixedPrice {
                original {
                  value
                  currency
                }
              }
            }
          }
        }
        listingTerms {
          fulfillmentTerms {
            __typename
            ... on FulfillmentTerms {
              packageSpecifications {
                packageDimensions {
                  length
                  width
                  height
                }
                packageWeight {
                  majorUnit
                  minorUnit
                }
                listingUnitOfMeasure
                irregularPackage
                listingPackageType
              }
              shippingTerms {
                handlingTimeDuration
                shippingServices {
                  rank
                }
              }
              digitalDeliverySupported
              globalShippingSupported
              freeShippingAvailable
              inStorePickupSupported
            }
            ... on BusinessPolicy {
              businessPolicyId
              description
              marketplace
              name
            }
          }
          paymentTerms {
            __typename
            ... on PaymentTerms {
              immediatePay
            }
            ... on BusinessPolicy {
              businessPolicyId
            }
          }
          listingFormat
          lifecycleTerms {
            listingDurationInDays
            startAt
          }
          bestOfferTerms {
            acceptBestOffer
            autoAcceptThresholdAmount {
              original {
                value
                currency
              }
            }
            autoDeclineThresholdAmount {
              original {
                value
                currency
              }
            }
          }
          itemLocation {
            country
            postalCode
            location
          }
        }
      }
      listingFees {
        listingFeeType
        feeAmount {
          value
          currency
        }
        promotionalDiscount {
          value
          currency
        }
      }
      warnings {
        warningCode
        warningMessage
        additionalInformation {
          name
          value
        }
      }
    }
    ... on CreateListingValidationError {
      errorCode
      errorMessage
      violations {
        violationCode
        violationDescription
        inputPath
        additionalInformation {
          name
          value
        }
      }
      warnings {
        warningCode
        warningMessage
        additionalInformation {
          name
          value
        }
      }
    }
    ... on CreateListingValidationSuccess {
      listing {
        listingId
        sku
        marketplace
        sellerProduct {
          title
          description
          aspects {
            name
            values
          }
          images {
            ebayImageUrl
          }
          categories {
            primaryCategory {
              id
            }
          }
          itemCondition {
            itemConditionId
          }
        }
        items {
          sku
          itemTerms {
            availability {
              quantityAvailable
            }
            pricingTerms {
              fixedPrice {
                original {
                  value
                  currency
                }
              }
            }
          }
        }
        listingTerms {
          fulfillmentTerms {
            __typename
            ... on FulfillmentTerms {
              packageSpecifications {
                packageDimensions {
                  length
                  width
                  height
                }
                packageWeight {
                  majorUnit
                  minorUnit
                }
                listingUnitOfMeasure
              }
              shippingTerms {
                handlingTimeDuration
                shippingServices {
                  rank
                }
              }
            }
          }
          paymentTerms {
            __typename
            ... on PaymentTerms {
              immediatePay
            }
          }
          listingFormat
          lifecycleTerms {
            listingDurationInDays
            startAt
          }
          bestOfferTerms {
            acceptBestOffer
            autoAcceptThresholdAmount {
              original {
                value
                currency
              }
            }
            autoDeclineThresholdAmount {
              original {
                value
                currency
              }
            }
          }
          itemLocation {
            country
            postalCode
            location
          }
        }
      }
      listingFees {
        listingFeeType
        feeAmount {
          value
          currency
        }
        promotionalDiscount {
          value
          currency
        }
      }
      warnings {
        warningCode
        warningMessage
        additionalInformation {
          name
          value
        }
      }
    }
  }
}
