query SellerListings($input: SellerListingsInput!) {
  sellerListings(input: $input) {
    listings {
      __typename
      ... on ListingSuccess {
        listingId
        listing {
          ...ListingFields
        }
      }
    }
  }
}

fragment ListingFields on ListingV2 {
  sellerProduct {
    title
    ebayGeneratedTitle
    description
    images {
      ebayImageUrl
      externalImageUrl
      order
    }
  }
  listingId
  marketplace
  listingTerms {
    listingFormat
    lifecycleTerms {
      listingDurationInDays
      createdAt
      actualEndAt
      endListingReason
      listingStatus
      scheduledEndAt
      startAt
    }
    listingFulfillmentTerms {
      inStorePickupSupported
      globalShippingSupported
      freeShippingAvailable
      digitalDeliverySupported
      packageSpecifications {
        irregularPackage
        listingPackageType
        listingUnitOfMeasure
        packageDimensions {
          height
          length
          unit
          width
        }
        packageWeight {
          majorUnit
          minorUnit
          unit
        }
      }
      shippingTerms {
        buyerResponsibleForShipping
        handlingTimeDuration
        includedShipToLocations {
          country
          continent
          sellerShippingRegion
        }
        excludedShipToLocations {
          continent
          country
          sellerShippingRegion
        }
      }
    }
    listingReturnTerms {
      businessPolicy {
        businessPolicyId
        description
        marketplace
        name
      }
      domesticReturnTerms {
        listingRefundMethod
        returnAccepted
        returnDuration
        returnShipmentInvoicee
      }
      returnInstructions
      internationalReturnTerms {
        listingRefundMethod
        returnAccepted
        returnDuration
        returnShipmentInvoicee
      }
    }
    listingPaymentTerms {
      businessPolicy {
        businessPolicyId
      }
      immediatePay
      paymentInstructions
    }
    internationalSiteVisibility
    hideParticipation
    visualEnhancements {
      boldTitle
      galleryPlus
      subtitle
    }
    bestOfferTerms {
      acceptBestOffer
      autoAcceptThresholdAmount {
        original {
          currency
          value
        }
      }
      autoDeclineThresholdAmount {
        original {
          currency
          value
        }
      }
    }
    taxTerms {
      salesTaxApplicableToShipping
      salesTaxJurisdictionId
      salesTaxPercentage
      salesTaxTableUsed
      thirdPartyTaxCategoryCode
      vatPercentage
      vatRecognizedBusinessSeller
      vatRestrictedToBusinessUser
    }
    itemLocation {
      country
      location
      postalCode
    }
    totalQuantityAvailable
  }
}
