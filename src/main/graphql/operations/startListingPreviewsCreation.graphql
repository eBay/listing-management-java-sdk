mutation StartListingPreviewsCreation($input: StartListingPreviewsCreationInput!) {
  startListingPreviewsCreation(input: $input) {
    errors {
      errorDescription
    }
    listingPreviewsCreationTask {
      id
      result {
        completionStatus
        invalidProducts {
          clientProvidedProductDetails {
            category
            aspects {
              name
              values
            }
            externalProductIdentifier {
              productType
              productId
            }
            images
            sku
            title
          }
          description
        }
        listingPreviews {
          aspects {
            aspectValues
            name
            values {
              confidence
              value
            }
          }
          category {
            categoryId
          }
          clientProvidedProductDetails {
            aspects {
              name
              values
            }
            category
            externalProductIdentifier {
              productId
              productType
            }
            images
            sku
            title
          }
          description
          images
          mappingReferenceId
          product {
            id
            epid
            aspects {
              aspectValues
              displayName
            }
            category {
              categoryId
            }
            imageUrls
            productId
            title
          }
          sku
          title
        }
        unmappedProducts {
          aspects {
            name
            values
          }
          category
          externalProductIdentifier {
            productId
            productType
          }
          images
          sku
          title
        }
        unprocessedProducts {
          aspects {
            name
            values
          }
          category
          externalProductIdentifier {
            productId
            productType
          }
          images
          sku
          title
        }
      }
    }
  }
}
